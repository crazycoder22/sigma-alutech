name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- Legacy static site (root) ----------
  legacy-unit-and-integration:
    name: Legacy site — Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # ---------- Next.js app (web/) ----------
  web-tests:
    name: Web app — Vitest + Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sigma
          POSTGRES_PASSWORD: sigma
          POSTGRES_DB: sigma
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sigma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sigma:sigma@localhost:55432/sigma
      TEST_DATABASE_URL: postgres://sigma:sigma@localhost:55432/sigma_test
      SESSION_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      SEED_ADMIN_EMAIL: admin@sigmaalutech.in
      SEED_ADMIN_PASSWORD: sigma-admin-2026
      # Exercise the webhook's signature check; the provider stays mocked,
      # so nothing is ever sent.
      WHATSAPP_APP_SECRET: ci-app-secret
      WHATSAPP_VERIFY_TOKEN: ci-verify-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create test database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U sigma -c "CREATE DATABASE sigma_test;"

      - name: Push schema (dev + test DBs)
        run: |
          npx drizzle-kit push --force
          DATABASE_URL=$TEST_DATABASE_URL npx drizzle-kit push --force

      - name: Migrate legacy JSON content and seed admin
        run: |
          npm run db:migrate-json
          npm run db:seed-admin
          npm run db:seed-payroll

      - name: Run Vitest (unit + integration)
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npx playwright test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-results
          path: web/test-results/
          retention-days: 7
